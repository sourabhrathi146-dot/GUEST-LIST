<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2430">
<title>Guest List</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --ink:#1B2430;
  --ink-soft:#3A4657;
  --paper:#FAF7F2;
  --paper-line:#E7E1D6;
  --gold:#C9A25D;
  --gold-deep:#A9803F;
  --green:#4C7A5E;
  --green-bg:#E7F0EA;
  --red:#B5533C;
  --red-bg:#F6E7E2;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--paper);
  font-family:'Inter',sans-serif;
  color:var(--ink);
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}

.wrap{max-width:760px;margin:0 auto;padding:20px 16px 90px;}

.header{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  border-bottom:3px solid var(--ink);
  padding-bottom:12px;
  margin-bottom:18px;
  gap:10px;
}
.header h1{
  font-family:'Fraunces',serif;
  font-weight:700;
  font-size:1.7rem;
  margin:0;
  letter-spacing:-0.01em;
}
.header .tag{
  font-family:'Inter',sans-serif;
  font-size:0.68rem;
  text-transform:uppercase;
  letter-spacing:0.1em;
  color:var(--ink-soft);
  background:var(--paper);
  border:1px solid var(--ink-soft);
  padding:4px 8px;
  border-radius:20px;
  white-space:nowrap;
}

.badge-count{
  font-family:'Fraunces',serif;
  font-weight:700;
  font-size:1.05rem;
  color:var(--gold-deep);
}

.controls{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:14px;
}
input[type=text]{
  flex:1;
  min-width:160px;
  padding:12px 14px;
  border:1.5px solid var(--paper-line);
  border-radius:8px;
  font-family:'Inter',sans-serif;
  font-size:1rem;
  background:#fff;
  color:var(--ink);
}
input[type=text]:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold);}

button{
  font-family:'Inter',sans-serif;
  font-weight:600;
  font-size:0.9rem;
  border:none;
  border-radius:8px;
  padding:12px 16px;
  cursor:pointer;
  transition:transform .08s ease, box-shadow .15s ease;
}
button:active{transform:scale(0.97);}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px;}

.btn-add{background:var(--ink);color:var(--paper);}
.btn-mic{background:var(--gold);color:var(--ink);display:flex;align-items:center;gap:7px;}
.btn-mic.listening{background:var(--red);color:#fff;animation:pulse 1.1s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(181,83,60,0.45);}50%{box-shadow:0 0 0 8px rgba(181,83,60,0);}}
.btn-pdf{background:transparent;color:var(--ink);border:1.5px solid var(--ink);}

.status{
  font-size:0.82rem;
  color:var(--ink-soft);
  min-height:18px;
  margin-bottom:12px;
}
.status.error{color:var(--red);}

table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 0 var(--paper-line);}
thead th{
  text-align:left;
  font-size:0.68rem;
  text-transform:uppercase;
  letter-spacing:0.08em;
  color:var(--paper);
  background:var(--ink);
  padding:10px 10px;
}
th.col-no,td.col-no{width:40px;text-align:center;}
th.col-check,td.col-check{width:52px;text-align:center;}
th.col-del,td.col-del{width:40px;text-align:center;}

tbody tr{border-bottom:1px solid var(--paper-line);}
tbody tr:last-child{border-bottom:none;}
tbody tr.present{background:var(--green-bg);}

td{padding:9px 10px;font-size:0.92rem;}
td.col-no{font-family:'Fraunces',serif;font-weight:700;color:var(--gold-deep);}

.name-input{
  border:none;
  background:transparent;
  width:100%;
  font-family:'Inter',sans-serif;
  font-size:0.95rem;
  color:var(--ink);
  padding:5px 2px;
  border-radius:5px;
}
.name-input:focus{outline:1.5px solid var(--gold);background:#fff;}

input[type=checkbox]{
  width:20px;height:20px;
  accent-color:var(--green);
  cursor:pointer;
}

.del-btn{
  background:none;border:none;color:var(--red);
  font-size:1.1rem;cursor:pointer;padding:4px 8px;border-radius:6px;
  font-weight:700;line-height:1;
}

.empty-row td{
  text-align:center;
  padding:28px 12px;
  color:var(--ink-soft);
  font-style:italic;
  font-size:0.88rem;
}

.footer-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:16px;
  font-size:0.82rem;
  color:var(--ink-soft);
  flex-wrap:wrap;
  gap:6px;
}

.install-banner{
  display:none;
  background:var(--ink);
  color:var(--paper);
  padding:10px 14px;
  border-radius:10px;
  font-size:0.85rem;
  margin-bottom:14px;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.install-banner button{
  background:var(--gold);color:var(--ink);padding:8px 12px;font-size:0.82rem;white-space:nowrap;
}

@media print{
  body{background:#fff;}
  .controls, .status, .btn-pdf, .del-btn, .footer-bar .hint, .install-banner{display:none !important;}
  .wrap{max-width:100%;padding:0;}
  table{box-shadow:none;}
  thead th{background:#1B2430 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;color:#fff !important;}
  tr.present{background:#E7F0EA !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <h1>Guest List</h1>
    <span class="tag">Voice Entry · Print Ready</span>
  </div>

  <div class="install-banner" id="installBanner">
    <span>Install this app on your home screen</span>
    <button id="installBtn">Install</button>
  </div>

  <div class="controls">
    <input type="text" id="nameInput" placeholder="Type a guest name and press Enter…" autocomplete="off">
    <button class="btn-add" id="addBtn">+ Add</button>
    <button class="btn-mic" id="micBtn">🎤 Speak Name</button>
    <button class="btn-pdf" id="pdfBtn">⭳ Export to PDF</button>
  </div>

  <div class="status" id="status">Tap "Speak Name" and say a guest's name — it'll be added automatically.</div>

  <table>
    <thead>
      <tr>
        <th class="col-no">No.</th>
        <th>Guest Name</th>
        <th class="col-check">Present</th>
        <th class="col-del"></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>

  <div class="footer-bar">
    <span><span class="badge-count" id="countTotal">0</span> guests · <span id="countPresent">0</span> marked present</span>
    <span class="hint">Click any name to edit it</span>
  </div>

</div>

<script>
const STORAGE_KEY = 'guestListData';
let guests = [];
let idCounter = 1;

function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      guests = parsed.guests || [];
      idCounter = parsed.idCounter || (guests.length + 1);
    }
  }catch(e){ console.error('Load failed', e); }
}
function saveData(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ guests, idCounter }));
  }catch(e){ console.error('Save failed', e); }
}

const tbody = document.getElementById('tbody');
const nameInput = document.getElementById('nameInput');
const addBtn = document.getElementById('addBtn');
const micBtn = document.getElementById('micBtn');
const pdfBtn = document.getElementById('pdfBtn');
const statusEl = document.getElementById('status');
const countTotal = document.getElementById('countTotal');
const countPresent = document.getElementById('countPresent');

function render(){
  tbody.innerHTML = '';
  if(guests.length === 0){
    tbody.innerHTML = '<tr class="empty-row"><td colspan="4">No guests added yet. Speak or type a name to begin.</td></tr>';
  } else {
    guests.forEach((g, idx) => {
      const tr = document.createElement('tr');
      tr.className = g.present ? 'present' : '';
      tr.innerHTML = `
        <td class="col-no">${idx + 1}</td>
        <td><input class="name-input" type="text" value="${escapeHtml(g.name)}" data-id="${g.id}"></td>
        <td class="col-check"><input type="checkbox" data-id="${g.id}" ${g.present ? 'checked' : ''}></td>
        <td class="col-del"><button class="del-btn" data-id="${g.id}" title="Remove">✕</button></td>
      `;
      tbody.appendChild(tr);
    });
  }
  countTotal.textContent = guests.length;
  countPresent.textContent = guests.filter(g => g.present).length;

  tbody.querySelectorAll('.name-input').forEach(inp => {
    inp.addEventListener('input', e => {
      const id = Number(e.target.dataset.id);
      const g = guests.find(x => x.id === id);
      if(g) g.name = e.target.value;
      countTotal.textContent = guests.length;
      saveData();
    });
  });
  tbody.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', e => {
      const id = Number(e.target.dataset.id);
      const g = guests.find(x => x.id === id);
      if(g) g.present = e.target.checked;
      saveData();
      render();
    });
  });
  tbody.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      const id = Number(e.target.dataset.id);
      guests = guests.filter(x => x.id !== id);
      saveData();
      render();
    });
  });
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function addGuest(name){
  const trimmed = name.trim();
  if(!trimmed) return;
  guests.push({ id: idCounter++, name: trimmed, present: false });
  saveData();
  render();
}

addBtn.addEventListener('click', () => {
  addGuest(nameInput.value);
  nameInput.value = '';
  nameInput.focus();
});
nameInput.addEventListener('keydown', e => {
  if(e.key === 'Enter'){
    addGuest(nameInput.value);
    nameInput.value = '';
  }
});

// ---- Voice recognition ----
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let listening = false;

if(SpeechRecognition){
  recognition = new SpeechRecognition();
  recognition.lang = 'en-US';
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => {
    listening = true;
    micBtn.classList.add('listening');
    micBtn.textContent = '● Listening…';
    statusEl.className = 'status';
    statusEl.textContent = 'Listening — say a guest\'s name now.';
  };

  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    const cleaned = transcript.trim().replace(/\.$/, '');
    const name = cleaned.replace(/\b\w/g, c => c.toUpperCase());
    addGuest(name);
    statusEl.textContent = `Added "${name}". Tap the mic to add another.`;
  };

  recognition.onerror = (event) => {
    statusEl.className = 'status error';
    if(event.error === 'not-allowed' || event.error === 'permission-denied'){
      statusEl.textContent = 'Microphone permission denied. Allow mic access in your browser to use voice entry.';
    } else if(event.error === 'no-speech'){
      statusEl.textContent = 'Didn\'t catch that — no speech detected. Try again.';
    } else {
      statusEl.textContent = 'Voice recognition error: ' + event.error + '. You can still type names manually.';
    }
  };

  recognition.onend = () => {
    listening = false;
    micBtn.classList.remove('listening');
    micBtn.textContent = '🎤 Speak Name';
  };

  micBtn.addEventListener('click', () => {
    if(listening){
      recognition.stop();
    } else {
      try{
        recognition.start();
      }catch(err){
        statusEl.className = 'status error';
        statusEl.textContent = 'Could not start microphone. Try again in a moment.';
      }
    }
  });
} else {
  micBtn.disabled = true;
  micBtn.style.opacity = '0.5';
  micBtn.title = 'Voice input not supported in this browser';
  statusEl.className = 'status error';
  statusEl.textContent = 'Voice entry isn\'t supported in this browser. On iPhone, use Chrome/Safari typing instead; on Android, try Chrome for voice.';
}

// ---- PDF export (print) ----
pdfBtn.addEventListener('click', () => {
  document.title = 'Guest List';
  window.print();
});

// ---- PWA install prompt ----
let deferredPrompt = null;
const installBanner = document.getElementById('installBanner');
const installBtn = document.getElementById('installBtn');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBanner.style.display = 'flex';
});

installBtn.addEventListener('click', async () => {
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBanner.style.display = 'none';
});

window.addEventListener('appinstalled', () => {
  installBanner.style.display = 'none';
});

// ---- Service worker registration ----
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.error('SW registration failed', err));
  });
}

loadData();
render();
</script>
</body>
</html>
